name: Refresh portfolio data

# Regenerates src/data/github-projects.json (and project screenshots) from GitHub.
# The commit triggers the site redeploy, so the portfolio is always up to date.
on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour to spread API load
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # GH_TOKEN lives only in the server-side job env — it is never bundled for the browser.
      - name: Fetch GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-projects.json public/projects
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: refresh portfolio data [skip ci]"
            git push
          fi
